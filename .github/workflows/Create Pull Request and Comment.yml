name: Create Pull Request and Comment
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Scheduled Empty Commit Branch']
    types: [completed]
jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    env:
        GITHUB_TOKEN: ${{ secrets.UPGRADETESTSUITETOKEN }}
    steps:
      - uses: actions/checkout@v3
      - name: Get current date
        id: get-date
        run: echo ::set-output name=date ::$(date +%m-%d)
      - name: Get second to last commit message
        id: get-commit-message
        run: |
          git log --pretty=format:"%b" HEAD

      - name: Create Pull Request with gh
        run: |
          gh pr create --title "Autogenerated - ${{ steps.get-date.outputs.date }}" --body "This pull request has been generated automatically." --head refs/heads/upgrade-test-suite-branch --base refs/heads/master
      - name: Add Comment to Pull Request with first commit message
        run: |
          gh pr comment upgrade-test-suite-branch --body "Last Commit: ${{ steps.get-commit-message.outputs.message }}"
          
      - name: Add Comment to Pull Test
        run: |
          gh pr comment upgrade-test-suite-branch --body "ci:test:upgrade"
